projects:
    title: Projects
#    intro: "."
    
    projects:
      - project:
        title: ContagionNET
        link: https://patents.google.com/patent/US20230051833A1/en
        tagline: I led the modelling team for the <a href="https://www.datarobot.com/blog/contagionnet-wins-innovation-award/"><b>award-winning</b></a> ContagionNET project, forecasting and optimizing the efficacy of a rapid antigen testing approach to combatting COVID-19.
      - project:
        title: DataRobot AI Apps
        link: https://www.datarobot.com/
        tagline: I was Data Science Competency Lead and eventually interim Team Lead for DataRobot's <a href="https://www.datarobot.com/platform/no-code-ai-app-builder/"><b>Automated Applications</b></a> team.
      - project:
        title: MNE-Python
        link: https://www.martinos.org/mne/stable/index.html
        tagline: "I am a core contributor to MNE-Python, a free and open analysis suite for EEG and MEG data in Python. I am primarily working on visualisation and statistics."
      - project:
        title: Assorted data analysis
        tagline: I still enjoy the ocassional data analysis side project, such as looking at <a href="decarbonization/"><b>succesful and unsuccesful decarbonisation strategies in the EU</b></a>.
      - project:
        title: Various vibe coded web apps
        tagline: "<a href='https://jona-sassenhagen.github.io/a_breach_to_the_past/'><b>A little 'what if Zelda met Into the Breach' game.</b></a> And: <a href='https://jona-sassenhagen.github.io/should_i_burn_wood_or_not/'><b>it's cold, should I burn wood or use my heating system?</b></a> as well as <a href='https://jona-sassenhagen.github.io/leselini/'><b>Leselini</b></a>"


publications:
    title: Key Scientific Publications
    intro: I have conducted research on the neural correlates of language processing, with a focus on methodological tools (statistics, machine learning, visualisation, signal processing). For more, see <a href="https://scholar.google.de/citations?hl=en&user=oyAdD34AAAAJ&view_op=list_works&sortby=pubdate"><b>Google Scholar</b></a>.
    publications:
      - paper:
        title: <a href="https://onlinelibrary.wiley.com/doi/abs/10.1111/psyp.13335">Cluster‐based permutation tests of MEG/EEG data do not establish significance of effect latency or location</a>
        authors: "Jona Sassenhagen & Dejan Draschkow"
        notes: 'Our <a href="https://wiley.altmetric.com/details/54483737/twitter"> <b>surprisingly impactful</b></a> paper on a common issue with an important nonparametric resampling-based statistical inference procedure.'
      - paper:
        title: <a href="https://www.ncbi.nlm.nih.gov/pubmed/25791606">The P600 as a correlate of ventral attention network reorientation</a>
        authors: "Jona Sassenhagen & Ina Bornkessel-Schlesewsky"
        notes: 'The <a href="https://www.ncbi.nlm.nih.gov/pubmed/25892410"><b>first paper pre-registered under the Cortex Registered Report format.</b></a>'
      - paper:
        title: <a href="https://www.ncbi.nlm.nih.gov/pubmed/25151545">Single-trial analyses reveal that the late EEG positivity following linguistically deviant material is reaction time aligned.</a>
        authors: "Jona Sassenhagen, Matthias Schlesewsky & Ina Bornkessel-Schlesewsky"
        notes: 'This paper is perhaps the <a href="https://web.archive.org/web/20190810211235/http://blogs.discovermagazine.com/neuroskeptic/2013/02/03/unilaterally-raising-the-scientific-standard/#.XU8zRy-l3RY"><b>first</b></a> pre-registered basic neuroimaging paper. I have been <a href="https://web.archive.org/web/20190702021449/http://blogs.discovermagazine.com/neuroskeptic/2013/03/23/more-on-preregistration/"><b>interviewed by the incomparable Neuroskeptic</b></a> over this.'

