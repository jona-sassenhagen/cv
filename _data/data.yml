career-profile: 
    title: Career Profile
    text: 'I am a data scientist/ML engineer currently working as a research engineer and team lead at <a href="https://neocybernetica.com"> <b>Neo Cybernetica</b></a>.

    I have a background as a research scientist at the intersection of linguistics and neuroscience, and in contributing to open source projects such as Pandas, Scikit-Learn, Langchain, Pytorch-Optimizer.'


